<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Lineage</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #fffefb; --ink: #1f1e1b; --muted: #6f6c64; --faint: #a8a49a;
  --line: #e2dfd6; --grid: #e7e4dc; --accent: #2459c6; --accent-soft: #e6ecf8; --on-accent: #ffffff;
  --star: #c98a00; --edge: #bdb9ae; --danger: #b93a2b;
  --shadow: 0 1px 2px rgba(30,25,15,.06), 0 8px 28px rgba(30,25,15,.09);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --surface: #1d1c1a; --ink: #ebe9e3; --muted: #a29f97; --faint: #6c6962;
    --line: #302f2c; --grid: #22211f; --accent: #7ea6ff; --accent-soft: #1c2740; --on-accent: #0d1424;
    --star: #f0b429; --edge: #4d4b46; --danger: #ff8a7a;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 28px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); overflow: hidden;
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
body.busy, body.busy * { cursor: progress !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.btn { padding: 5px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.star { display: inline-flex; align-items: center; gap: 6px; }
.btn.star[aria-pressed=true] { border-color: var(--star); background: color-mix(in srgb, var(--star) 14%, var(--surface)); }
.btn.star svg path, .pill svg path { fill: none; stroke: currentColor; stroke-width: 1.3; }
.btn.star[aria-pressed=true] svg path, .pill svg path { fill: var(--star); stroke: var(--star); }
.btn.danger { color: var(--danger); }
.btn.danger-fill { background: var(--danger); border-color: var(--danger); color: var(--surface); font-weight: 600; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px;
  font-weight: 500; letter-spacing: 0; text-transform: none; }
.link-btn:hover { text-decoration: underline; }

header { position: fixed; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center;
  flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); }
h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.grow { flex: 1; }
#q { width: 240px; max-width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); outline: none; }
#q:focus { border-color: var(--accent); }
select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

#canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; user-select: none; }
#canvas.dragging { cursor: grabbing; }
.label { fill: var(--muted); font-size: 13px; font-weight: 600; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.3; stroke-dasharray: 4 4; transition: opacity .15s; }
.edge.off { display: none; }
.edge.bo { stroke: var(--accent); stroke-width: 2; stroke-dasharray: none; marker-end: url(#arrow); }
.ghost { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; pointer-events: none; marker-end: url(#arrow); }
.arrowhead { fill: var(--accent); }
.node { cursor: pointer; transition: opacity .15s; }
.node .card { fill: var(--surface); stroke: var(--line); }
.node:hover .card { stroke: var(--faint); }
.node.sel .card { stroke: var(--accent); stroke-width: 2; }
.node.drop .card { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 5 3; }
.node .c { height: 100%; padding: 6px 26px 6px 12px; display: flex; flex-direction: column; justify-content: center; }
.node .t { flex-shrink: 0; font-size: 12.5px; font-weight: 600; line-height: 1.3; overflow: hidden; padding-bottom: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.node .star path { fill: none; stroke: var(--faint); stroke-width: 1.2; }
.node .star circle { fill: transparent; }
.node .star { opacity: 0; transition: opacity .12s; }
.editable .node:hover .star, .node.starred .star { opacity: 1; }
.editable .node .star { cursor: pointer; }
.editable .node .star:hover path { stroke: var(--star); }
.node.starred .star path { fill: var(--star); stroke: var(--star); }
.node .m { margin-top: 1px; font-size: 11px; line-height: 1.3; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.handle { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; cursor: crosshair; opacity: 0; transition: opacity .12s; }
.node:hover .handle, .node.sel .handle { opacity: 1; }
.dim { opacity: .12; }

.dock { position: fixed; left: 16px; bottom: 16px; z-index: 2; display: flex; align-items: center; gap: 12px;
  padding: 5px 6px 5px 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  font-size: 12px; color: var(--muted); }
.dock button { min-width: 30px; height: 28px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); cursor: pointer; }
.dock .sw { display: inline-flex; align-items: center; gap: 6px; }
.dock .sw:last-child { padding-right: 6px; }
.dock button.sw { min-width: 0; height: auto; padding: 0; border: 0; background: none; color: inherit; cursor: pointer; }
.dock button.sw[aria-pressed=false] { opacity: .45; text-decoration: line-through; }

aside { position: fixed; z-index: 4; top: var(--header, 0px); right: 0; bottom: 0; width: min(440px, 100%); overflow-y: auto;
  padding: 18px 22px 48px; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateX(105%); transition: transform .2s ease; }
aside.open { transform: none; }
@media (max-width: 720px) {
  aside { top: auto; left: 0; width: 100%; height: 62vh; border-left: 0; border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0; transform: translateY(105%); }
  #q { width: 100%; order: 9; }
}
.close { float: right; width: 30px; height: 30px; margin: -4px -8px 0 8px; border: 0; border-radius: 8px;
  background: none; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
.close:hover { background: var(--bg); }
.kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11px;
  font-weight: 650; color: var(--star); background: color-mix(in srgb, var(--star) 14%, transparent); }
aside h2 { margin: 8px 0 6px; font-size: 18px; line-height: 1.3; letter-spacing: -.01em; }
.authors { color: var(--muted); font-size: 13px; }
.links { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 10px 0 4px; font-size: 13px; }
code { padding: 1px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg);
  font: 12px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace; }
.tag { color: var(--muted); font-size: 12px; }
.tag::before { content: "#"; opacity: .6; }
aside h3 { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 6px;
  font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rel ul { margin: 0; padding: 0; list-style: none; }
.rel li { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.rel li:first-child { border-top: 0; }
.rel .yr { margin-left: 6px; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.x { align-self: start; border: 0; background: none; padding: 0 2px; color: var(--faint); font-size: 17px; line-height: 1.2; cursor: pointer; }
.x:hover { color: var(--danger); }
.notes p, .notes ul, .notes ol, .notes blockquote { margin: 6px 0; }
.notes ul, .notes ol { padding-left: 20px; }
.notes h4, .notes h5, .notes h6 { margin: 14px 0 4px; font-size: 13px; }
.notes blockquote { padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
.notes pre { overflow-x: auto; padding: 8px 10px; border-radius: 8px; background: var(--bg); }
.notes pre code { padding: 0; border: 0; }
.notes details { margin-top: 22px; padding-top: 10px; border-top: 1px solid var(--line); }
.notes summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.placeholder { color: var(--faint); font-style: italic; cursor: pointer; }
.placeholder:hover { color: var(--muted); }
.editor textarea { display: block; width: 100%; min-height: 110px; resize: vertical; padding: 8px 10px;
  border: 1px solid var(--accent); border-radius: 8px; background: var(--bg); outline: none;
  font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; }
.editor .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.hint { margin-right: auto; color: var(--faint); font-size: 12px; }
.danger-zone { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); }
mark { color: inherit; background: color-mix(in srgb, var(--star) 30%, transparent); }
.empty { color: var(--muted); }
#empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; pointer-events: none; }
#empty > div { pointer-events: auto; }

dialog { width: min(460px, calc(100% - 32px)); max-height: 90vh; padding: 18px 20px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog h4 { margin: 0 0 6px; font-size: 15px; }
dialog p { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
dialog label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 12px; }
dialog input, dialog select { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
dialog input:focus, dialog select:focus { outline: none; border-color: var(--accent); }
dialog menu { display: flex; justify-content: flex-end; gap: 8px; margin: 18px 0 0; padding: 0; }
#toast { position: fixed; left: 50%; bottom: 20px; z-index: 10; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
  max-width: min(600px, calc(100% - 32px)); padding: 9px 14px; border-radius: 10px; background: var(--ink); color: var(--bg);
  font-size: 13px; white-space: pre-line; box-shadow: var(--shadow); }
#toast.error { background: var(--danger); color: var(--surface); }
#toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Paper lineage</h1>
  <span class="count" id="count"></span>
  <span class="grow"></span>
  <input id="q" type="search" placeholder="Search titles, authors, notes  ( / )" autocomplete="off">
  <button class="btn star" id="starred" aria-pressed="false" title="Show only starred papers">Starred</button>
  <select id="tag" aria-label="Tag"><option value="">All tags</option></select>
  <button class="btn" id="relink" title="Refresh citation links and venues from Semantic Scholar" hidden>&#8635; Citations</button>
  <button class="btn primary" id="add" hidden>+ Add paper</button>
</header>
<svg id="canvas">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="arrowhead" d="M0,1 L9,5 L0,9 z"/></marker></defs>
  <g id="world"><g id="grid"></g><g id="edges"></g><g id="nodes"></g><path id="ghost" class="ghost" style="display:none"/></g>
</svg>
<div class="dock">
  <button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit">Fit</button><button id="zin" aria-label="Zoom in">+</button>
  <button id="arrange" title="Lay the cards out again as lineages (forgets cards you dragged)">Arrange</button>
  <span class="sw"><svg width="26" height="8"><path d="M1 4H25" class="edge bo" style="marker-end:none"/></svg>builds on</span>
  <button class="sw" id="cites" title="Show or hide citation links"><svg width="26" height="8"><path d="M1 4H25" class="edge"/></svg>cites</button>
  <span class="sw" id="draghint" hidden><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" class="handle" style="opacity:1"/></svg>drag onto a paper to link</span>
</div>
<aside id="panel"></aside>
<div id="empty" hidden><div>No papers yet.<br><code>pp add &lt;arxiv-id | doi | title&gt;</code></div></div>
<dialog id="dlg"><form method="dialog"><h4></h4><div class="dlg-body"></div>
  <menu><button type="button" class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok">Save</button></menu></form></dialog>
<div id="toast" hidden></div>
<script>
let DATA = /*DATA*/null;
const W = 220, H = 64, GX = 26, GY = 18, BAND_GAP = 56, TREE_GAP = 90, PER_ROW = 5, NS = 'http://www.w3.org/2000/svg';
const STAR = 'M' + Array.from({length: 10}, (_, i) => {  // five points, radius 6.5, around 0,0
  const a = Math.PI * (i / 5 - .5), r = i % 2 ? 2.7 : 6.5;
  return (r * Math.cos(a)).toFixed(2) + ',' + (r * Math.sin(a)).toFixed(2);
}).join('L') + 'Z';
const starIcon = () => `<svg width="14" height="14" viewBox="-7.5 -7.5 15 15" aria-hidden="true"><path d="${STAR}"/></svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const fold = s => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const plural = (k, w) => `${k} ${w}${k === 1 ? '' : 's'}`;
const surname = n => n.authors[0] ? n.authors[0].split(' ').pop() + (n.authors.length > 1 ? ' et al.' : '') : '';
const where = n => [n.venue, n.year].filter(Boolean).join(' ');
const svg = $('#canvas'), world = $('#world'), panel = $('#panel'), q = $('#q'), ghost = $('#ghost');
const EDIT = !!DATA.editable;
document.body.classList.toggle('editable', EDIT);
$('#add').hidden = $('#relink').hidden = $('#draghint').hidden = !EDIT;
const headerHeight = () => document.documentElement.style.setProperty('--header', $('header').offsetHeight + 'px');
headerHeight(); addEventListener('resize', headerHeight);  // the panel opens below the toolbar

$('#starred').insertAdjacentHTML('afterbegin', starIcon());

// ---- dragged card positions and the citations switch live in this browser only
const POS = 'pp.pos', CITES = 'pp.cites';
const loadPos = () => { try { return JSON.parse(localStorage.getItem(POS)) || {}; } catch { return {}; } };
const storePos = p => { try { localStorage.setItem(POS, JSON.stringify(p)); } catch {} };
let citesPref = null, citesOn = false;  // null: show citations only while nothing is linked by hand
try { const v = localStorage.getItem(CITES); if (v) citesPref = v === 'on'; } catch {}

// ---- build: data -> graph, layout, drawing. Runs again after every edit.
let nodes = [], edges = [], byId = {}, X0 = 0, X1 = 0, Y0 = 0, Y1 = 0, selId = decodeURIComponent(location.hash.slice(1)) || null;
function build(data) {
  DATA = {...DATA, ...data};
  nodes = DATA.nodes; byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const curated = new Set(DATA.edges.filter(e => e.kind === 'builds_on').map(e => e.from + '>' + e.to));
  edges = DATA.edges.filter(e => e.kind === 'builds_on' || !curated.has(e.from + '>' + e.to));
  nodes.forEach(n => { n.in = []; n.out = []; n.hay = [n.id, n.title, n.venue, n.year, ...n.authors, ...n.tags, n.body].join(' ').toLowerCase(); });
  edges.forEach(e => { e.a = byId[e.from]; e.b = byId[e.to]; e.a.out.push(e); e.b.in.push(e); });
  $('#count').textContent = `${plural(nodes.length, 'paper')} · ${plural(edges.length, 'link')}`;
  const tag = $('#tag').value, tags = [...new Set(nodes.flatMap(n => n.tags))].sort();
  $('#tag').replaceChildren(new Option('All tags', ''), ...tags.map(t => new Option('#' + t, t)));
  $('#tag').value = tags.includes(tag) ? tag : '';

  const bo = edges.filter(e => e.kind === 'builds_on');
  citesOn = citesPref ?? !bo.length;
  $('#cites').setAttribute('aria-pressed', citesOn);
  const looseTop = layout(bo.length ? bo : edges);  // citations shape the layout only until you link papers yourself
  const pos = loadPos();
  nodes.forEach(n => { if (pos[n.id]) [n.cx, n.cy] = pos[n.id]; });
  if (nodes.length) {
    X0 = Math.min(...nodes.map(n => n.cx)) - W / 2; X1 = Math.max(...nodes.map(n => n.cx)) + W / 2;
    Y0 = Math.min(...nodes.map(n => n.cy)) - H / 2; Y1 = Math.max(...nodes.map(n => n.cy)) + H / 2;
  }

  // draw
  $('#grid').replaceChildren(); $('#edges').replaceChildren(); $('#nodes').replaceChildren();
  if (looseTop !== null) el('text', {class: 'label', x: 0, y: looseTop - 14}, $('#grid')).textContent = 'Not linked yet';
  edges.forEach(e => {
    e.el = el('path', {class: e.kind === 'builds_on' ? 'edge bo' : 'edge', d: curve(e)}, $('#edges'));
  });
  nodes.forEach(n => {
    const g = n.el = el('g', {class: 'node' + (n.star ? ' starred' : '')}, $('#nodes'));
    g.dataset.id = n.id;
    el('title', {}, g).textContent = n.title;
    el('rect', {class: 'card', width: W, height: H, rx: 9}, g);
    const c = document.createElement('div');
    c.className = 'c';
    c.innerHTML = `<div class="t">${esc(n.title)}</div><div class="m">${esc([surname(n), where(n)].filter(Boolean).join(' · '))}</div>`;
    el('foreignObject', {width: W, height: H}, g).appendChild(c);
    if (EDIT || n.star) {
      const s = el('g', {class: 'star', transform: `translate(${W - 15},15)`}, g);
      el('circle', {r: 11}, s); el('path', {d: STAR}, s);
      if (EDIT) el('title', {}, s).textContent = n.star ? 'Unstar' : 'Star';
    }
    if (EDIT) el('title', {}, el('circle', {class: 'handle', cx: W / 2, cy: H, r: 5.5}, g)).textContent = 'Drag onto another paper to link them';
    moveCard(n);
  });
  $('#empty').hidden = nodes.length > 0;
  $('.dock').hidden = !nodes.length;
  if (EDIT) $('#empty > div').innerHTML = 'No papers yet.<br><br><button class="btn primary" onclick="addPaper()">+ Add paper</button>';
  const s = selId && byId[selId];
  if (s) show(s, {keep: true}); else { selId = null; show(null); }
}
// layout: papers joined by `lay` links form lineages. In each, a paper sits one row below the
// deepest paper it builds on (generations, not calendar years). Lineages are packed side by side,
// tallest first, into a block shaped like the window; papers without links fill a grid below it.
// Returns the top of that grid, or null when there is no grid to label.
function layout(lay) {
  const up = new Map(nodes.map(n => [n, []])), down = new Map(nodes.map(n => [n, []]));
  lay.forEach(e => { down.get(e.a).push(e.b); up.get(e.b).push(e.a); });
  const byAge = (a, b) => (a.year || 0) - (b.year || 0) || a.id.localeCompare(b.id);
  const linked = nodes.filter(n => up.get(n).length || down.get(n).length);
  const loose = nodes.filter(n => !up.get(n).length && !down.get(n).length).sort(byAge);

  // generations: longest path from a root
  const gen = new Map(), unmet = new Map(linked.map(n => [n, up.get(n).length])), todo = new Set(linked);
  let ready = linked.filter(n => !up.get(n).length);
  while (todo.size) {
    if (!ready.length)  // a cycle: release the paper with the fewest unplaced parents, oldest first
      ready = [[...todo].sort((a, b) => unmet.get(a) - unmet.get(b) || byAge(a, b))[0]];
    const n = ready.shift();
    if (!todo.delete(n)) continue;
    gen.set(n, Math.max(0, ...up.get(n).filter(m => gen.has(m)).map(m => gen.get(m) + 1)));
    for (const m of down.get(n)) { unmet.set(m, unmet.get(m) - 1); if (!unmet.get(m)) ready.push(m); }
  }

  // each lineage on its own: rows by generation, ordered by barycenter sweeps (fewer crossings)
  const seen = new Set(), trees = [];
  for (const n of linked) {
    if (seen.has(n)) continue;
    const t = [], stack = [n];
    seen.add(n);
    while (stack.length) {
      const m = stack.pop();
      t.push(m);
      for (const o of [...up.get(m), ...down.get(m)]) if (!seen.has(o)) { seen.add(o); stack.push(o); }
    }
    trees.push(tree(t));
  }
  function tree(t) {  // -> {t, w, h}, with n.lx, n.ly relative to the lineage's top left
    const bands = [];
    t.sort(byAge).forEach(n => (bands[gen.get(n)] ||= []).push(n));
    const rows = bands.filter(Boolean);
    const place = b => b.forEach((n, i) => {
      const row = Math.floor(i / PER_ROW), inRow = Math.min(PER_ROW, b.length - row * PER_ROW);
      n.row = row; n.lx = (i % PER_ROW - (inRow - 1) / 2) * (W + GX);
    });
    rows.forEach(place);
    const mean = ns => ns.length ? ns.reduce((s, m) => s + m.lx, 0) / ns.length : null;
    for (let pass = 0; pass < 8; pass++) {
      const dn = pass % 2 === 0;
      for (const b of dn ? rows : [...rows].reverse()) {
        for (const n of b) {
          const u = mean(up.get(n).filter(m => gen.get(m) !== gen.get(n)));
          const d = mean(down.get(n).filter(m => gen.get(m) !== gen.get(n)));
          n.key = (dn ? u ?? d : d ?? u) ?? n.lx;
        }

function saveSection(n, f) {
  const ta = panel.querySelector(`section[data-field="${f}"] textarea`);
  if (ta) api('set', {key: n.id, pairs: [`${f}=${ta.value}`]});
}
async function editDetails(n) {
  const cur = {title: n.title, authors: n.authors.join(', '), venue: n.venue, year: String(n.year || ''),
               tags: n.tags.join(', '), arxiv: n.arxiv || '', doi: n.doi || ''};
  const v = await ask({title: 'Edit details', fields: [
    {name: 'title', label: 'Title', value: cur.title, required: true},
    {name: 'authors', label: 'Authors, comma-separated', value: cur.authors},
    {name: 'venue', label: 'Venue', value: cur.venue, placeholder: 'CVPR'},
    {name: 'year', label: 'Year', value: cur.year},
    {name: 'tags', label: 'Tags, comma-separated', value: cur.tags},
    {name: 'arxiv', label: 'arXiv id', value: cur.arxiv},
    {name: 'doi', label: 'DOI', value: cur.doi},
    {name: 'key', label: 'Key (renaming updates every link to it)', value: n.id, required: true}]});
  if (!v) return;
  const pairs = Object.keys(cur).filter(k => v[k].trim() !== cur[k]).map(k => `${k}=${v[k].trim()}`);
  if (pairs.length && !await api('set', {key: n.id, pairs})) return;
  const key = v.key.trim();
  if (key !== n.id) {
    const p = loadPos();
    if (await api('mv', {key: n.id, new: key}) && p[n.id]) { p[key] = p[n.id]; delete p[n.id]; storePos(p); }
  }
}
const short = m => m.title.length > 48 ? m.title.slice(0, 46) + '…' : m.title;
async function linkPapers(a, b) {  // a was dragged onto b: the older one is the source, or else a
  const old = edges.find(e => e.kind === 'builds_on' && (e.a === a && e.b === b || e.a === b && e.b === a));
  const [src, dst] = old ? [old.a, old.b] : (a.year || 0) > (b.year || 0) ? [b, a] : [a, b];
  if (!old && !await api('set', {key: dst.id, pairs: [`builds_on+=${src.id}`]})) return;
  toast(`${old ? 'Already linked' : 'Linked'}: “${short(dst)}” builds on “${short(src)}”`, {actions: [
    ['Flip', () => flip(src.id, dst.id)],
    ...old ? [] : [['Undo', () => api('set', {key: dst.id, pairs: [`builds_on-=${src.id}`]})]]]});
}
async function flip(src, dst) {  // "dst builds on src" becomes "src builds on dst"
  if (await api('set', {key: dst, pairs: [`builds_on-=${src}`]})) api('set', {key: src, pairs: [`builds_on+=${dst}`]});
}
async function addLink(n) {
  const taken = new Set(n.in.filter(e => e.kind === 'builds_on').map(e => e.a));
  const others = nodes.filter(m => m !== n && !taken.has(m)).sort((a, b) => a.title.localeCompare(b.title));
  if (!others.length) return toast('No other papers to link to.');
  const v = await ask({title: 'This paper builds on…', ok: 'Link', fields: [
    {name: 'src', label: 'Paper', options: others.map(m => [m.id, `${m.title}${where(m) ? ` (${where(m)})` : ''}`])}]});
  if (v) api('set', {key: n.id, pairs: [`builds_on+=${v.src}`]});
}
async function unlink(a, b) {
  if (await api('set', {key: b.id, pairs: [`builds_on-=${a.id}`]}))
    toast(`Removed: “${short(b)}” builds on “${short(a)}”`, {actions: [
      ['Undo', () => api('set', {key: b.id, pairs: [`builds_on+=${a.id}`]})]]});
}
async function remove(n) {
  const ok = await ask({title: 'Delete this paper?', ok: 'Delete', danger: true,
    text: `“${n.title}”. This deletes lib/${n.id}.md, including its notes, and every link to it.`});
  if (ok) api('rm', {key: n.id});
}
async function addPaper() {
  const v = await ask({title: 'Add a paper', ok: 'Add', fields: [
    {name: 'q', label: 'arXiv id, DOI, URL or title', required: true, placeholder: '2503.11651'},
    {name: 'tags', label: 'Tags, comma-separated', value: $('#tag').value}]});
  if (!v) return;
  toast('Fetching metadata…');
  const j = await api('add', {q: v.q.trim(), tags: v.tags.split(',').map(s => s.trim()).filter(Boolean)});
  if (j && byId[j.key]) focus(byId[j.key]);
}
if (EDIT) {
  $('#add').onclick = addPaper;
  $('#relink').onclick = () => { toast('Asking Semantic Scholar…'); api('link'); };
  setInterval(sync, 2500);  // pick up edits made elsewhere, e.g. `pp set` in a terminal
  addEventListener('visibilitychange', () => sync());
}
async function sync(force = false) {
  if (!force && (document.hidden || drag || $('#dlg').open || panel.querySelector('.editor'))) return;
  try {
    const s = (await (await fetch('/api/stamp')).json()).stamp;
    if (s !== stamp) { stamp = s; build(await (await fetch('/api/data')).json()); }
  } catch {}
}

build(DATA);
fit(false);
if (sel) show(sel);  // moves the view only if the paper would be off screen
</script>
